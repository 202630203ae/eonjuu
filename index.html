<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 저녁 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <span class="badge">Today's Dinner</span>
            <h1>오늘 저녁 메뉴 추천 🍽️</h1>
            <p class="subtitle">결정 장애 탈출! 버튼 하나로 오늘 저녁을 정해보세요.</p>
        </header>

        <main>
            <div class="card">
                <div class="emoji-display" id="emojiDisplay">❓</div>
                <div class="menu-name" id="menuName">버튼을 눌러주세요!</div>
                <div class="menu-category" id="menuCategory">오늘의 추천 메뉴가 여기에 표시됩니다</div>
                
                <button class="btn-recommend" id="recommendBtn">
                    <span class="btn-text">저녁 메뉴 추천 받기</span>
                    <span class="btn-icon">🎲</span>
                </button>
            </div>

            <div class="history-container">
                <h3>최근 추천받은 메뉴</h3>
                <div class="history-tags" id="historyTags">
                    <span class="empty-history">아직 추천받은 메뉴가 없습니다.</span>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 Today's Dinner Picker. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
